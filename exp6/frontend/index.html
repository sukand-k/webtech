<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agri Tech & Co - Personal Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="container">
    <h2 class="mb-4 text-success">Agri Tech & Co - Manage Your Profile</h2>

    <form id="infoForm" class="mb-4">
      <input type="hidden" id="userId">
      <div class="mb-3"><input type="text" class="form-control" id="name" placeholder="Full Name" required></div>
      <div class="mb-3"><input type="email" class="form-control" id="email" placeholder="Email" required></div>
      <div class="mb-3"><input type="text" class="form-control" id="phone" placeholder="Phone" required></div>
      <div class="mb-3"><textarea class="form-control" id="address" placeholder="Address" required></textarea></div>
      <button type="submit" class="btn btn-success">Save Profile</button>
    </form>

    <table class="table table-bordered" id="infoTable">
      <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Address</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    const form = document.getElementById('infoForm');
    const tbody = document.querySelector('#infoTable tbody');

    async function loadUsers() {
      const res = await axios.get('http://localhost:3000/users');
      tbody.innerHTML = '';
      res.data.forEach(user => {
        tbody.innerHTML += `
          <tr>
            <td>${user.name}</td>
            <td>${user.email}</td>
            <td>${user.phone}</td>
            <td>${user.address}</td>
            <td>
              <button onclick="editUser('${user._id}')" class="btn btn-warning btn-sm">Edit</button>
              <button onclick="deleteUser('${user._id}')" class="btn btn-danger btn-sm">Delete</button>
            </td>
          </tr>`;
      });
    }

    form.onsubmit = async e => {
      e.preventDefault();
      const data = {
        name: form.name.value,
        email: form.email.value,
        phone: form.phone.value,
        address: form.address.value
      };
      const id = form.userId.value;
      if (id) {
        await axios.put(`http://localhost:3000/users/${id}`, data);
      } else {
        await axios.post('http://localhost:3000/users', data);
      }
      form.reset();
      form.userId.value = '';
      loadUsers();
    };

    async function editUser(id) {
      const res = await axios.get(`http://localhost:3000/users/${id}`);
      const user = res.data;
      form.name.value = user.name;
      form.email.value = user.email;
      form.phone.value = user.phone;
      form.address.value = user.address;
      form.userId.value = user._id;
    }

    async function deleteUser(id) {
      if (confirm('Are you sure you want to delete this profile?')) {
        await axios.delete(`http://localhost:3000/users/${id}`);
        loadUsers();
      }
    }

    loadUsers();
  </script>
</body>
</html>
